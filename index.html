<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>GrandCity — M1 Walk a Block</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0e14;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #e6e9ef;
    }
    #scene { display: block; width: 100%; height: 100%; }

    /* HUD */
    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 8px 10px;
      background: rgba(10, 13, 18, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      pointer-events: none;
      user-select: none;
      z-index: 5;
    }
    .hud-row { display: flex; justify-content: space-between; gap: 16px; }
    .hud-label { color: #8b93a7; }
    .hud-value { color: #b7e0ff; }

    /* Start / pause overlay */
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, rgba(18, 22, 32, 0.72), rgba(6, 8, 12, 0.9));
      cursor: pointer;
      text-align: left;
      z-index: 10;
    }
    #overlay.hidden { display: none; }
    #overlay .panel {
      width: min(440px, 86vw);
      padding: 28px 30px;
      background: rgba(16, 20, 28, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
    }
    #overlay h1 { margin: 0 0 2px; font-size: 30px; letter-spacing: 0.5px; }
    #overlay .sub { margin: 0 0 16px; color: #8b93a7; font-size: 13px; }
    #overlay .cta { margin: 0 0 14px; font-size: 16px; color: #b7e0ff; }
    #overlay ul { margin: 0; padding-left: 18px; color: #c3cad8; font-size: 13px; line-height: 1.9; }
    #overlay kbd {
      background: #232a36; border: 1px solid #39414f; border-bottom-width: 2px;
      border-radius: 4px; padding: 1px 6px; font-size: 12px;
    }
    #overlay .msg { min-height: 18px; margin: 14px 0 0; color: #ff9b9b; font-size: 13px; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="overlay" role="button" tabindex="0" aria-label="Start GrandCity">
    <div class="panel">
      <h1>GrandCity</h1>
      <p class="sub">M1 · Walk a Block</p>
      <p class="cta">Click to play</p>
      <ul>
        <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrow keys — move</li>
        <li>Mouse — look around</li>
        <li><kbd>Shift</kbd> — sprint</li>
        <li><kbd>Esc</kbd> — release the mouse</li>
      </ul>
      <p class="msg" id="overlay-message"></p>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
